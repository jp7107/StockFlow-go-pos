<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="840" viewBox="0 0 1500 840" role="img" aria-labelledby="title desc">
  <title id="title">StockFlow backend architecture</title>
  <desc id="desc">Logical architecture showing client requests entering a Gin HTTP adapter, passing through application services and domain rules, then using outbound ports implemented by PostgreSQL and Redis adapters.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#172238"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#29264A"/><stop offset="1" stop-color="#1C2944"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity=".24"/></filter>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#67D6D0"/></marker>
    <marker id="arrowViolet" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B8A6FF"/></marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F6C778"/></marker>
    <style>
      .title{font:700 34px Inter,ui-sans-serif,system-ui,sans-serif;fill:#F7FAFF}
      .subtitle{font:400 16px Inter,ui-sans-serif,system-ui,sans-serif;fill:#AEBBD0}
      .label{font:700 18px Inter,ui-sans-serif,system-ui,sans-serif;fill:#F7FAFF}
      .body{font:400 14px Inter,ui-sans-serif,system-ui,sans-serif;fill:#C3CEE0}
      .small{font:500 12px Inter,ui-sans-serif,system-ui,sans-serif;fill:#93A4BE;letter-spacing:1.5px}
      .port{font:700 14px Inter,ui-sans-serif,system-ui,sans-serif;fill:#D9D1FF}
      .arrowlabel{font:600 12px Inter,ui-sans-serif,system-ui,sans-serif;fill:#9FE5E0}
    </style>
  </defs>
  <rect width="1500" height="840" rx="28" fill="url(#bg)"/>
  <circle cx="1330" cy="100" r="170" fill="#5B69C8" opacity=".08"/>
  <circle cx="120" cy="740" r="180" fill="#00BFA6" opacity=".05"/>
  <text x="64" y="72" class="title">StockFlow | Backend Architecture</text>
  <text x="64" y="104" class="subtitle">Go · Gin · Hexagonal Architecture · PostgreSQL · Redis</text>
  <rect x="64" y="142" width="1372" height="620" rx="24" fill="#101A2B" stroke="#34445E" stroke-width="1.5"/>
  <text x="90" y="180" class="small">REQUEST INGRESS</text>
  <text x="475" y="180" class="small">APPLICATION CORE · PORTS &amp; ADAPTERS</text>
  <text x="1130" y="180" class="small">INFRASTRUCTURE</text>

  <!-- Client -->
  <g filter="url(#shadow)">
    <rect x="88" y="330" width="210" height="150" rx="18" fill="#172F4A" stroke="#4A74B5" stroke-width="1.7"/>
    <rect x="108" y="350" width="42" height="42" rx="12" fill="#2F5480"/>
    <path d="M119 362h20v13h-20z M123 358h12 M124 379h10" stroke="#D4E8FF" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="108" y="421" class="label">API Consumer</text>
    <text x="108" y="445" class="body">POS client / operator</text>
    <text x="108" y="466" class="body">HTTP + JSON</text>
  </g>

  <!-- HTTP adapter -->
  <g filter="url(#shadow)">
    <rect x="346" y="330" width="220" height="150" rx="18" fill="#103D42" stroke="#2BAA9B" stroke-width="1.7"/>
    <rect x="366" y="350" width="42" height="42" rx="12" fill="#176A68"/>
    <path d="M376 362h22 M376 369h22 M376 376h15" stroke="#D9FFFA" stroke-width="2.5" stroke-linecap="round"/>
    <text x="366" y="421" class="label">HTTP Adapter</text>
    <text x="366" y="445" class="body">Gin routes &amp; handlers</text>
    <text x="366" y="466" class="body">Request / response mapping</text>
  </g>
  <path d="M298 405 H340" stroke="#67D6D0" stroke-width="3" fill="none" marker-end="url(#arrowCyan)"/>
  <text x="301" y="390" class="arrowlabel">HTTP</text>

  <!-- Core boundary -->
  <rect x="600" y="220" width="470" height="490" rx="22" fill="url(#core)" stroke="#7767D5" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="628" y="256" class="small" style="fill:#B8A6FF">CORE — FRAMEWORK-INDEPENDENT INTENT</text>

  <g filter="url(#shadow)">
    <rect x="650" y="300" width="370" height="105" rx="16" fill="#352E62" stroke="#8A79EB" stroke-width="1.5"/>
    <text x="676" y="337" class="label">Application Services</text>
    <text x="676" y="362" class="body">Use cases and orchestration</text>
    <text x="676" y="383" class="body">Coordinates domain operations</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="650" y="438" width="370" height="105" rx="16" fill="#263750" stroke="#5C7DAA" stroke-width="1.5"/>
    <text x="676" y="475" class="label">Domain Model</text>
    <text x="676" y="500" class="body">POS concepts and business rules</text>
    <text x="676" y="521" class="body">Core types, independent of adapters</text>
  </g>
  <g>
    <rect x="650" y="574" width="370" height="94" rx="16" fill="#282544" stroke="#9A8AEF" stroke-width="1.5"/>
    <text x="676" y="610" class="port">Outbound Ports</text>
    <text x="676" y="635" class="body">Repository and cache contracts</text>
    <text x="676" y="653" class="body">Implemented by infrastructure adapters</text>
  </g>
  <path d="M566 405 H642" stroke="#67D6D0" stroke-width="3" fill="none" marker-end="url(#arrowCyan)"/>
  <text x="574" y="389" class="arrowlabel">calls</text>
  <path d="M835 405 V431" stroke="#B8A6FF" stroke-width="2.5" fill="none" marker-end="url(#arrowViolet)"/>
  <path d="M835 543 V567" stroke="#B8A6FF" stroke-width="2.5" fill="none" marker-end="url(#arrowViolet)"/>

  <!-- adapters -->
  <g filter="url(#shadow)">
    <rect x="1120" y="270" width="270" height="180" rx="18" fill="#40301C" stroke="#D59B47" stroke-width="1.7"/>
    <rect x="1142" y="292" width="44" height="44" rx="12" fill="#6D4B22"/>
    <ellipse cx="1164" cy="304" rx="12" ry="5" fill="none" stroke="#FFE5B5" stroke-width="2"/>
    <path d="M1152 304v16c0 6 24 6 24 0v-16 M1152 312c0 6 24 6 24 0" fill="none" stroke="#FFE5B5" stroke-width="2"/>
    <text x="1142" y="366" class="label">PostgreSQL Adapter</text>
    <text x="1142" y="390" class="body">pgx + Squirrel</text>
    <text x="1142" y="412" class="body">SQL persistence</text>
    <path d="M1142 426h220" stroke="#936A35" stroke-width="1"/>
    <text x="1142" y="440" class="body" style="font-size:12px">Database connection / queries</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1120" y="500" width="270" height="155" rx="18" fill="#402126" stroke="#D76570" stroke-width="1.7"/>
    <rect x="1142" y="520" width="44" height="44" rx="12" fill="#6B2D35"/>
    <path d="M1152 532h24v21h-24z M1152 539h24 M1152 546h24" fill="none" stroke="#FFDDE0" stroke-width="2"/>
    <text x="1142" y="590" class="label">Redis Adapter</text>
    <text x="1142" y="614" class="body">go-redis client</text>
    <text x="1142" y="636" class="body">Cache access</text>
  </g>
  <path d="M1020 610 H1080 V360 H1112" stroke="#F6C778" stroke-width="2.5" fill="none" marker-end="url(#arrowAmber)"/>
  <text x="1032" y="345" class="arrowlabel" style="fill:#F6C778">port</text>
  <path d="M1020 625 H1090 V575 H1112" stroke="#F6C778" stroke-width="2.5" fill="none" marker-end="url(#arrowAmber)"/>

  <!-- footnotes -->
  <rect x="92" y="684" width="468" height="44" rx="12" fill="#172438" stroke="#34445E"/>
  <circle cx="114" cy="706" r="5" fill="#67D6D0"/>
  <text x="130" y="711" class="body">Inbound request flow</text>
  <circle cx="298" cy="706" r="5" fill="#F6C778"/>
  <text x="314" y="711" class="body">Outbound infrastructure</text>
  <text x="90" y="795" class="subtitle" style="font-size:13px">Logical architecture view · Confirm exact package boundaries and guarantees against the current implementation.</text>
  <text x="1408" y="795" class="subtitle" text-anchor="end" style="font-size:13px">StockFlow</text>
</svg>
